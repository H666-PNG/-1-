    // ===================== 功能逻辑 =====================
    let mode = 0; // 0=单词 1=课文
    let wordIndex = localStorage.getItem("krWordIndex") ? Number(localStorage.getItem("krWordIndex")) : 0;
    let textIndex = 0;
    let speed = 0.8;

    const speedRange = document.getElementById('speedRange');
    const speedText = document.getElementById('speedText');

    // 语速调节
    speedRange.addEventListener('input', function(){
        speed = parseFloat(this.value);
        speedText.innerText = speed.toFixed(1);
    });

    // 渲染单词
    function renderWord() {
        const item = wordList[wordIndex];
        document.getElementById("korean").innerText = item.kr;
        document.getElementById("chinese").innerText = item.cn;
        localStorage.setItem("krWordIndex", wordIndex);
    }

    // 渲染课文
    function renderText() {
        const item = textList[textIndex];
        document.getElementById("lessonTitle").innerText = item.lesson;
        document.getElementById("koText").innerText = item.ko;
        document.getElementById("cnText").innerText = item.cn;
    }

    // 发音
    function playVoice() {
        let text = mode === 0 
            ? wordList[wordIndex].kr 
            : textList[textIndex].ko;
            
        const voice = new SpeechSynthesisUtterance(text);
        voice.lang = "ko-KR";
        voice.rate = speed;
        speechSynthesis.speak(voice);
    }

    // 上一个
    function prev() {
        if (mode === 0) {
            wordIndex = (wordIndex - 1 + wordList.length) % wordList.length;
            renderWord();
        } else {
            textIndex = (textIndex - 1 + textList.length) % textList.length;
            renderText();
        }
    }

    // 下一个
    function next() {
        if (mode === 0) {
            wordIndex = (wordIndex + 1) % wordList.length;
            renderWord();
        } else {
            textIndex = (textIndex + 1) % textList.length;
            renderText();
        }
    }

    // 重置
    function resetProgress() {
        wordIndex = 0;
        localStorage.setItem("krWordIndex", 0);
        renderWord();
    }

    // 切换模式
    function toggleMode() {
        mode = 1 - mode;
        document.getElementById("wordBox").style.display = mode === 0 ? "block" : "none";
        document.getElementById("textBox").style.display = mode === 1 ? "block" : "none";
        if (mode === 1) renderText();
        else renderWord();
    }

    // 初始化
    window.onload = function() {
        renderWord();
    };
</script>
